# Reusable: build binaries (standard + UI) - Windows only
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g. v0.8.0)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # POSIX platforms (Linux/macOS) removed per Windows-only strategy
  # build-unix:
  #   ... (commented out)

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-zlib
            make
            zip

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Build standard binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --version "$VERSION" CC=clang CXX=clang++
          else
            scripts/build.sh CC=clang CXX=clang++
          fi

      - name: Archive standard binary
        shell: msys2 {0}
        run: |
          BIN=build/c/semantic-memory-mcp
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          cp "$BIN" semantic-memory-mcp.exe
          scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          zip semantic-memory-mcp-windows-amd64.zip semantic-memory-mcp.exe LICENSE install.ps1 THIRD_PARTY_NOTICES.md

      - name: Build UI binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" CC=clang CXX=clang++
          else
            scripts/build.sh --with-ui CC=clang CXX=clang++
          fi

      - name: Archive UI binary
        shell: msys2 {0}
        run: |
          BIN=build/c/semantic-memory-mcp
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          cp "$BIN" semantic-memory-mcp.exe
          scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          zip semantic-memory-mcp-ui-windows-amd64.zip semantic-memory-mcp.exe LICENSE install.ps1 THIRD_PARTY_NOTICES.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-windows-amd64
          path: "*.zip"

  build-windows-arm64:
    # Native ARM64 Windows binary via the CLANGARM64 toolchain on the
    # windows-11-arm runner (the same toolchain the test suite already
    # exercises). Without it, ARM-Windows users fall back to the x86_64
    # binary under emulation, and npm/pip on native-ARM Node/Python 404.
    runs-on: windows-11-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-zlib
            make
            zip

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Build standard binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --version "$VERSION" CC=clang CXX=clang++
          else
            scripts/build.sh CC=clang CXX=clang++
          fi

      - name: Archive standard binary
        shell: msys2 {0}
        run: |
          BIN=build/c/semantic-memory-mcp
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          cp "$BIN" semantic-memory-mcp.exe
          scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          zip semantic-memory-mcp-windows-arm64.zip semantic-memory-mcp.exe LICENSE install.ps1 THIRD_PARTY_NOTICES.md

      - name: Build UI binary
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/build.sh --with-ui --version "$VERSION" CC=clang CXX=clang++
          else
            scripts/build.sh --with-ui CC=clang CXX=clang++
          fi

      - name: Archive UI binary
        shell: msys2 {0}
        run: |
          BIN=build/c/semantic-memory-mcp
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          cp "$BIN" semantic-memory-mcp.exe
          scripts/gen-third-party-notices.sh THIRD_PARTY_NOTICES.md
          zip semantic-memory-mcp-ui-windows-arm64.zip semantic-memory-mcp.exe LICENSE install.ps1 THIRD_PARTY_NOTICES.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-windows-arm64
          path: "*.zip"

  # Linux portable builds removed per Windows-only strategy
  # build-linux-portable:
  #   ... (commented out)
